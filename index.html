   guide:`<div class="tense"><b>Cases</b> are the jobs a noun can do. The ending tells you the job.<br><b>Nominative</b> = the doer (the subject). <b>Accusative</b> = the one the action happens to (the direct object).<br><b>Singular</b> = just one. <b>Plural</b> = more than one.</div>
    <div class="wide"><table class="chart"><tr><th></th><th>First declension</th><th>Second declension</th><th>Third declension</th></tr>
    <tr><th colspan="4">Singular</th></tr><tr><td><i>nominative</i></td><td class="lat">puella</td><td class="lat">servus</td><td class="lat">mercātor</td></tr><tr><td><i>accusative</i></td><td class="lat">puellam</td><td class="lat">servum</td><td class="lat">mercātōrem</td></tr>
    <tr><th colspan="4">Plural</th></tr><tr><td><i>nominative</i></td><td class="lat">puellae</td><td class="lat">servī</td><td class="lat">mercātōrēs</td></tr><tr><td><i>accusative</i></td><td class="lat">puellās</td><td class="lat">servōs</td><td class="lat">mercātōrēs</td></tr></table></div>
    <ul><li>A <b>declension</b> is a family of nouns that share the same endings.</li><li><b>Accusative singular</b> always ends in <b>-m</b>: -am, -um, -em.</li><li><b>Accusative plural</b> ends in <b>-ās, -ōs, -ēs</b>.</li><li>Third declension: nominative and accusative plural look the same (<span class="lat">mercātōrēs</span>). Use the rest of the sentence to tell which job it has.</li></ul>
    <p><span class="lat">amīcus puellam salūtat.</span> The friend greets the <b>girl</b>.<br><span class="lat">amīcus puellās salūtat.</span> The friend greets the <b>girls</b>.</p>
    <div class="tense perf"><b class="name">Superlatives</b> mean <b>very ___</b> (or most ___).<br><span class="lat">īrātus</span> angry &rarr; <span class="lat">īrātissimus</span> very angry. <span class="lat">laetus</span> happy &rarr; <span class="lat">laetissimus</span> very happy.<br>A few use <b>-errimus</b>: <span class="lat">pulcher</span> &rarr; <span class="lat">pulcherrimus</span> very beautiful.<br>The ending still matches the noun: <span class="lat">Pompēiānī erant īrātissimī</span>, <span class="lat">māter erat laetissima</span>.</div>`,
   grammar:{
    levels:[
     {title:'Grammar words',sub:'Nominative, accusative, singular, plural, superlative',quota:{'g8-term':10},
      teach:`<ul><li><b>Nominative</b> = the doer, the subject. <span class="lat">amīcus</span> in <span class="lat">amīcus puellam salūtat</span>.</li><li><b>Accusative</b> = the one the action happens to, the direct object. <span class="lat">puellam</span>.</li><li><b>Singular</b> = one. <b>Plural</b> = more than one.</li><li><b>Declension</b> = a family of nouns with the same endings.</li><li><b>Superlative</b> = very ___ (or most ___): <span class="lat">īrātissimus</span>.</li></ul><p class="tiny">Open the guide above for the full chart.</p>`},
     {title:'Complete the chart',sub:'Fill in the missing form',spell:'half',quota:{'g8-cellmc':4,'g8-cell':6},
      teach:`<ul><li>Each question shows the chart with one box marked <b>?</b>. Pick or type the form that goes there.</li><li>Some questions use a new noun next to the book's example. Copy the pattern of the example.</li><li>The ending is what counts, so a wrong ending is wrong. A small slip in the rest of the word earns half a point.</li><li>Macrons are optional.</li><li>Want to fill in the whole chart at once? Use <b>Fill in the chart</b> on the Stage 8 page.</li></ul>`},
     {title:'One or many? Doer or done-to?',sub:'Name each noun in a sentence',quota:{'g8-obj':4,'g8-subj':3,'g8-num':3},
      teach:`<ul><li>Find the verb (last). The doer is <b>nominative</b>. The one it happens to is <b>accusative</b>.</li><li>Then ask: one or more than one? <b>-m</b> = one. <b>-ās, -ōs, -ēs</b> = more than one.</li><li>Nominative plural: <b>-ae, -ī, -ēs</b> (<span class="lat">puellae, servī, mercātōrēs</span>). The verb ends in <b>-nt</b> too.</li></ul>`},
     {title:'What does the ending change?',sub:'Pick the English that matches',quota:{'g8-mean':8,'g8-obj':2},
      teach:`<p>One letter can change the whole meaning:</p><p><span class="lat">dominus servum vituperābat.</span> The master was cursing the <b>slave</b>.<br><span class="lat">dominus servōs vituperābat.</span> The master was cursing the <b>slaves</b>.</p><ul><li>Watch for <b>one vs. many</b>: -m is one, -ās/-ōs/-ēs is many.</li><li>Watch for <b>who does what</b>: the nominative does it, the accusative has it done to them, no matter the word order.</li></ul>`},
     {title:'Very ___: superlatives',sub:'-issimus and -errimus',spell:'half',quota:{'g8-sup':4,'g8-supt':3,'g8-supsent':3},
      teach:`<ul><li>A <b>superlative</b> means <b>very ___</b>. <span class="lat">nōtus</span> famous, <span class="lat">nōtissimus</span> very famous.</li><li>Most add <b>-issimus</b>. A few, like <span class="lat">pulcher</span>, add <b>-errimus</b>: <span class="lat">pulcherrimus</span>.</li><li>The ending changes to match the noun: <span class="lat">laetissima</span> (mother), <span class="lat">īrātissimī</span> (the Pompeians).</li><li>"Most ___" is fine too: most famous.</li></ul>`},
     {title:'Translate it',sub:'Build sentences, then type them',spell:'half',quota:{'g8-tiles':3,'g8-typed':7},
      teach:`<ul><li><b>Plan:</b> (1) Find the verb. (2) Find the nominative: who does it? (3) Find the accusative: who or what does it happen to? One or many? (4) Put it into English.</li><li>Look for <b>-issimus</b> words: they mean very ___.</li><li>Small spelling slips earn half a point. Words like <i>the</i> and <i>a</i> do not matter.</li></ul>`}

<script>
(function(){
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SR = mulberry32(20261006);
function shuffle(arr, r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick = (arr, r=Math.random) => arr[Math.floor(r()*arr.length)];
const L = s => `<span class="lat">${esc(s)}</span>`;
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

// ---------- text helpers. Macrons are optional everywhere: they are stripped before comparing.
function strip(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function norm(s){return strip(s).replace(/[^a-z' ]/g,' ').split(/\s+/).filter(t=>t&&!['the','a','an'].includes(t)).join(' ')}
function osa(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i]}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function endingDiff(a,b){const s=a.length<b.length?a:b,l=a.length<b.length?b:a;return l.startsWith(s)&&['s','es','ed','d','ing'].includes(l.slice(s.length))}
const PROT = new Set(['he','she','it','they','you','i','was','were','is','are','we']);
// returns 'exact' | 'close' | 'wrong'. 'close' = one small spelling slip, same word and same ending.
function judgeText(input, answers, opts){
  opts = opts||{};
  const n = norm(input); if(!n) return 'wrong';
  let best='wrong';
  for(const ans of answers){
    const m = norm(ans); if(!m) continue;
    if(n===m) return 'exact';
    const ta=n.split(' '), tb=m.split(' '); if(ta.length!==tb.length) continue;
    let diff=0, ok=true;
    for(let i=0;i<ta.length;i++){
      const x=ta[i], y=tb[i]; if(x===y) continue; diff++;
      if(PROT.has(x)||PROT.has(y)){ok=false;break}
      if(endingDiff(x,y)){ok=false;break}
      if(y.length<4||x.length<3){ok=false;break}
      if(osa(x,y)>(y.length>=9?2:1)){ok=false;break}
      if(opts.form && ta.length===1 && x.slice(-3)!==y.slice(-3)){ok=false;break}
    }
    if(ok && diff===1) best='close';
  }
  return best;
}

let C, ITEMS=[], byId={}, LEVELS=[], bankHTML=()=>'', tenseGuideHTML=()=>'', KEY='', S=null;
// ---------- levels
const SPELL = {lenient:'Spelling: close counts (you fix it)', half:'Spelling: close = half credit', exact:'Spelling: exact for full credit', none:'Spelling: choices only'};
function build6(){
C = CONTENT6;
const PERSON = {t:'he/she/it', nt:'they', s:'you'};
const BANK12 = C.stems.filter(s=>s[4]);
function bankHTML6(mode){
  if(mode==='none') return '';
  const rows = (mode==='notes'?BANK12:C.stems).map(s=>`<span class="lat">${esc(s[0])}-</span>: ${esc(s[1])}`);
  return `<details class="bank" open><summary>Verb stem bank</summary><div>${rows.join(' &nbsp;|&nbsp; ')}</div></details>`;
}

// ---------- items
ITEMS=[]; byId={};
function add(it){ it.ckey=it.ckey||it.id; byId[it.id]=it; ITEMS.push(it); return it; }
function mc(o){ return add(Object.assign({kind:'mc',section:'grammar',diff:2}, o)); }
function ty(o){ return add(Object.assign({kind:'type',section:'translation',diff:2}, o)); }

// --- vocabulary
const VOC = C.vocab.map(([lat,kind,primary,extra,hook])=>{
  const acc = new Set([primary, ...extra]);
  if(kind==='verb'){ [primary,...extra].forEach(v=>['he','she','it','he/she/it'].forEach(s=>acc.add(s+' '+v))); }
  return {lat, key:strip(lat), kind, primary, hook, answers:[...acc]};
});
VOC.forEach(w=>{
  const same = VOC.filter(x=>x!==w && x.kind===w.kind);
  const pool = same.length>=3? same : VOC.filter(x=>x!==w);
  const why = `${w.lat} means "${w.primary}". Hook: ${w.hook}`;
  const base = {why, ckey:'vocab:'+w.key, label:`${w.lat} (${w.primary})`};
  mc(Object.assign({}, base, {id:`v:${w.key}:l2e`, tag:'v-l2e', lvls:[1,2], section:'vocab', diff:1, pattern:'vocab: Latin to English',
    q:`What does ${L(w.lat)} mean?`, answer:w.primary, options:()=>[w.primary,...shuffle(pool).slice(0,3).map(x=>x.primary)]}));
  mc(Object.assign({}, base, {id:`v:${w.key}:e2l`, tag:'v-e2l', lvls:[1,2], section:'vocab', diff:2, pattern:'vocab: English to Latin',
    q:`Which Latin word means <b>${esc(w.primary)}</b>?`, answer:w.lat, options:()=>[w.lat,...shuffle(pool).slice(0,3).map(x=>x.lat)]}));
  ty(Object.assign({}, base, {id:`v:${w.key}:type`, tag:'v-type', lvls:[4,5,6], section:'vocab', pattern:'vocab: type the English',
    q:`Type the English for ${L(w.lat)}`, answers:w.answers, model:w.primary}));
  ty(Object.assign({}, base, {id:`v:${w.key}:t2l`, tag:'v-t2l', lvls:[5,6], section:'vocab', pattern:'vocab: type the Latin', form:false,
    q:`Type the Latin for <b>${esc(w.primary)}</b> <span class="hint">(macrons are optional)</span>`, answers:[w.lat], model:w.lat}));
  // unscramble (Level 4 bridge between seeing a word and spelling it)
  const letters = strip(w.lat).split('');
  let sc = letters.slice(); let tries=0; do{ sc=shuffle(letters,SR); tries++ }while(sc.join('')===letters.join('') && tries<20);
  ty(Object.assign({}, base, {id:`v:${w.key}:scr`, tag:'v-scr', lvls:[4], section:'vocab', pattern:'vocab: unscramble the Latin', form:false, diff:1,
    q:`Unscramble the letters to spell the Latin word for <b>${esc(w.primary)}</b>:<div class="latq">${esc(sc.join(' '))}</div>`, answers:[w.lat], model:w.lat}));
});

// --- verb forms
const STEMOBJ = C.stems.map(([s,base,ed,ing,bank,tenses])=>({s,base,ed,ing,bank,tenses}));
function latForm(st,tense,p){
  if(tense==='imp'){ const b = st.s.endsWith('ī') ? st.s.slice(0,-1)+'iē' : st.s; return b + (p==='t'?'bat':p==='nt'?'bant':'bās'); }
  return st.s + (p==='t'?'vit':'vērunt');
}
function enModel(st,tense,p){
  if(tense==='imp') return `${PERSON[p]} ${p==='t'?'was':'were'} ${st.ing}`;
  return `${PERSON[p]} ${st.ed}`;
}
function enAnswers(st,tense,p){
  const subs = p==='t'?['he','she','it','he/she/it']:[PERSON[p]];
  return subs.map(s=> tense==='imp' ? `${s} ${p==='t'?'was':'were'} ${st.ing}` : `${s} ${st.ed}`);
}
const FORMS=[];
STEMOBJ.forEach(st=>st.tenses.forEach(tense=>{
  const persons = tense==='imp' ? ['t','nt','s'] : ['t','nt'];
  persons.forEach(p=>FORMS.push({lat:latForm(st,tense,p), key:strip(latForm(st,tense,p)), st, tense, p, en:enAnswers(st,tense,p), model:enModel(st,tense,p)}));
}));
const FBYLAT = {}; FORMS.forEach(f=>FBYLAT[f.key]=f);
// answer set for English-to-Latin: every Latin form that has the same English meaning
function latAnswersFor(f){ return FORMS.filter(g=>g.tense===f.tense && g.p===f.p && g.st.base===f.st.base).map(g=>g.lat); }
const TENSE_NAME = {imp:'Imperfect', perf:'Past-Perfect', pres:'Present'};
const TENSE_MARK = {imp:'-ba- (was/were ___ing)', perf:'-vi- / -vēru- (___ed)', pres:'neither one (just a person ending)'};
const GUIDED = new Set(C.guided.map(strip)), STUDY = new Set(C.studyList.map(strip));

const PEOPLE = ['he/she/it','they','you'];
FORMS.forEach(f=>{
  const stemSame = FORMS.filter(g=>g!==f && g.tense===f.tense && g.p===f.p && g.st.base!==f.st.base);
  const base = {ckey:'verb:'+f.key, label:`${f.lat} (${f.model})`, form:true};
  const whyAll = `Right to left: ${f.lat} ends in -${f.p==='t'?'t':f.p==='nt'?'nt':'s'} = ${PERSON[f.p]}. Next comes ${f.tense==='imp'?'-ba-':'-vi-/-vēru-'} = ${f.tense==='imp'?'was/were ___ing':'___ed'}. The stem ${f.st.s}- = ${f.st.base}. So: ${f.model}.`;
  mc(Object.assign({}, base, {id:`f:${f.key}:person`, tag:'f-person', lvls:[3], section:'grammar', diff:1, pattern:'verb: who is doing it (person ending)',
    q:`Start at the END of ${L(f.lat)}. Who is doing the action?`, answer:PERSON[f.p], options:()=>PEOPLE, why:whyAll}));
  mc(Object.assign({}, base, {id:`f:${f.key}:tense`, tag:'f-tense', lvls:[3], section:'grammar', diff:2, pattern:'verb: which tense marker',
    q:`Next, look just before the person ending in ${L(f.lat)}. Which tense marker is it?`, answer:TENSE_MARK[f.tense],
    options:()=>[TENSE_MARK.imp,TENSE_MARK.perf,TENSE_MARK.pres], why:whyAll}));
  mc(Object.assign({}, base, {id:`f:${f.key}:stem`, tag:'f-stem', lvls:[3], section:'grammar', diff:2, pattern:'verb: what the stem means',
    q:`In ${L(f.lat)}, the verb stem is ${L(f.st.s+'-')}. What does the stem mean?`, answer:f.st.base,
    options:()=>[f.st.base,...shuffle(STEMOBJ.filter(s=>s.base!==f.st.base)).slice(0,3).map(s=>s.base)], why:whyAll}));
  const otherP = ['t','nt','s'].filter(p=>p!==f.p && (f.tense==='imp'||p!=='s'));
  const otherT = f.tense==='imp'?'perf':'imp';
  mc(Object.assign({}, base, {id:`f:${f.key}:trmc`, tag:'f-trans', lvls:[3], section:'translation', diff:2, pattern:'verb: translate (choose)',
    q:`Translate ${L(f.lat)}`, answer:f.model, why:whyAll,
    options:()=>{ const o=[f.model, enModel(f.st,f.tense,pick(otherP)), enModel(f.st,otherT,f.p), stemSame.length?enModel(pick(stemSame).st,f.tense,f.p):enModel(f.st,otherT,otherP[0]||'t')]; return o; }}));

function tenseGuide6(){
  return `<div class="tense"><b>Big idea:</b> a verb's <b>tense</b> tells you <b>when</b> and <b>what kind</b> of action. You can spot the tense by the little marker just before the person ending.</div>
  <div class="tense pres"><b class="name">Present</b> (happening now)<br>No marker. Just the person ending.<br><span class="lat">ambulat</span> = he/she/it walks. <span class="lat">ambulant</span> = they walk.</div>
  <div class="tense imp"><b class="name">Imperfect</b> (was/were ___ing)<br>Marker: <b>-ba-</b>. This is an action that <b>was going on</b> in the past. Think of a movie that is still rolling.<br><span class="lat">ambulābat</span> = he/she/it <b>was walking</b>. <span class="lat">ambulābant</span> = they <b>were walking</b>.</div>
  <div class="tense perf"><b class="name">Past-Perfect</b> (___ed)<br>Marker: <b>-vi-</b> or <b>-vēru-</b>. This is an action that <b>happened and is done</b>. Think of a photo, one finished moment.<br><span class="lat">ambulāvit</span> = he/she/it <b>walked</b>. <span class="lat">ambulāvērunt</span> = they <b>walked</b>.</div>
  <div class="wide"><table class="chart"><tr><th>Tense</th><th>Marker</th><th>English</th><th>Example</th></tr>
    <tr><td>Present</td><td>none</td><td>walks</td><td class="lat">ambulat</td></tr>
    <tr><td>Imperfect</td><td>-ba-</td><td>was/were ___ing</td><td class="lat">ambulābat</td></tr>
    <tr><td>Past-Perfect</td><td>-vi- / -vēru-</td><td>___ed</td><td class="lat">ambulāvit</td></tr></table></div>
  <p><b>Imperfect vs. Past-Perfect in plain English:</b> "I <b>was walking</b> to school" (the walking is in progress, not finished) is Imperfect. "I <b>walked</b> to school" (done) is Past-Perfect. Both are in the past. They just show the action in two different ways.</p>
  <p><b>Person endings</b> (the very end, same in every tense): <b>-s</b> you, <b>-t</b> he/she/it, <b>-nt</b> they.</p>
  <p><b>Spot it:</b> <span class="lat">vidēbant</span> has -ba- and -nt, so <b>they were seeing</b>. <span class="lat">superāvērunt</span> has -vēru- and -nt, so <b>they overpowered</b>. <span class="lat">stant</span> has no marker, so <b>they stand</b>.</p>
  <p class="tiny">Your class guide calls the -vi- tense "Past-Perfect." Some books call it just "Perfect." Use your teacher's word on the test. The odd one in the sort list is <span class="lat">erat</span>: it is "was," so it goes with the Imperfect.</p>`;
}

  {id:'s25',l:'heri centuriō in vīllā cēnāvit.',en:ex(['Yesterday the centurion'],['dined','ate dinner','had dinner'],['in the house','in the villa']).concat(ex(['The centurion'],['dined','ate dinner','had dinner'],['in the house','in the villa'],['yesterday'])),gloss:'heri = yesterday',d:['today','was','dining']},
  {id:'s26',l:'servus tamen nihil fēcit.',en:['The slave, however, did nothing','However, the slave did nothing','The slave did nothing, however','The slave however made nothing'],gloss:'tamen = however, fēcit = did',d:['was','something','they']},
  {id:'s27',l:'umbra servum valdē terruit.',en:ex(['The ghost','The shadow'],['frightened','scared','terrified'],['the slave'],['very much','a lot','greatly']),gloss:'valdē = very much',d:['were','slaves','little']},
  {id:'s28',l:'Metella nihil rogāvit.',en:['Metella asked nothing','Metella did not ask anything',"Metella didn't ask anything"],gloss:'rogat = asks',d:['was','something','they']},
  {id:'s29',l:'omnēs servī tacitē stābant.',en:ex(['All the slaves'],['were standing','stood'],['quietly','silently']),gloss:'omnēs = all (from omnis)',d:['was','every','loudly']},
  {id:'s30',l:'gladiātor leōnem necāvit.',en:ex(['The gladiator'],['killed'],['the lion']),gloss:'necat = kills',d:['gladiators','was','killing']}
];
const stripP = s => s.replace(/[.,;!?]/g,'').replace(/\s+/g,' ').trim();

function build7(){
  C = CONTENT7;
  ITEMS=[]; byId={};
  function add(it){ it.ckey=it.ckey||it.id; byId[it.id]=it; ITEMS.push(it); return it; }
  const mc = o => add(Object.assign({kind:'mc',section:'grammar',diff:2}, o));
  const ty = o => add(Object.assign({kind:'type',section:'translation',diff:2}, o));
  const tl = o => add(Object.assign({kind:'tiles',section:'translation',diff:2}, o));
  const fill = (s,pron) => s.replace('{be}', pron==='they'?'were':'was');

  // ----- vocabulary model
  const V = C.vocab.map(o=>{
    const base=[...o.s,...(o.x||[])]; const acc=new Set(base);
    if(o.k==='verb'){ base.forEach(v=>{ ['he','she','it','he/she/it'].forEach(p=>acc.add(p+' '+v)); acc.add('to '+v); }); }
    return Object.assign({key:strip(o.l), answers:[...acc]}, o);
  });
  const R = C.recall.map(([l,k,e,x,st])=>({l,k,e,x,st,key:strip(l)}))
    .concat(CONTENT6.vocab.map(([l,k,e,x])=>({l,k:k==='little'?'little':k,e,x,st:6,key:strip(l)})));
  const R_ENG = R.map(r=>({k:r.k,e:r.e}));
  const ENG_POOL = V.flatMap(w=>w.s.map(e=>({k:w.k,e}))).concat(R_ENG);
  const LAT_POOL = V.map(w=>({k:w.k,e:w.l})).concat(R.map(r=>({k:r.k,e:r.l})));
  function opts(correct, kind, pool, exclude, n=3){
    const ok = p=>!exclude.has(p.e) && p.e!==correct;
    const same=shuffle(pool.filter(p=>p.k===kind && ok(p))), rest=shuffle(pool.filter(p=>p.k!==kind && ok(p)));
    const out=[]; for(const p of same.concat(rest)){ if(out.length>=n) break; if(!out.includes(p.e)) out.push(p.e); }
    return [correct,...out];
  }
  function scramble(word){
    const letters=strip(word).split(''); let sc=letters.slice(), t=0;
    do{ sc=shuffle(letters,SR); t++ }while(sc.join('')===letters.join('') && t<20);
    return sc.join(' ');
  }

  V.forEach(w=>{
    const multi=w.s.length>1;
    const sensesTxt=w.s.map(s=>`"${s}"`).join(' or ');
    const whyW=`${w.l} means ${sensesTxt}.${multi?' One Latin word, two English words.':''} Hook: ${w.h}`;
    const exclude=new Set(w.s);
    w.s.forEach((sense,i)=>{
      mc({id:`v7:${w.key}:l2e:${i}`, tag:'v-l2e', lvls:[1], section:'vocab', diff:1, pattern:'vocab: Latin to English', ckey:'vocab:'+w.key, label:`${w.l} (${w.s.join(' / ')})`, why:whyW,
        q:`What does ${L(w.l)} mean?`, answer:sense, options:()=>opts(sense,w.k,ENG_POOL,exclude)});
      mc({id:`v7:${w.key}:e2l:${i}`, tag:'v-e2l', lvls:[2], section:'vocab', diff:2, pattern:'vocab: English to Latin', ckey:'vocab:'+w.key+':'+i, label:`${sense} = ${w.l}`, why:whyW,
        q:`Which Latin word means <b>${esc(sense)}</b>?`, answer:w.l, options:()=>opts(w.l,w.k,LAT_POOL,new Set([w.l]))});
      ty({id:`v7:${w.key}:t2l:${i}`, tag:'v-t2l', lvls:[4,5], section:'vocab', pattern:'vocab: type the Latin', ckey:'vocab:'+w.key+':'+i, label:`${sense} = ${w.l}`, why:whyW, form:false,
        q:`Type the Latin for <b>${esc(sense)}</b> <span class="hint">(macrons are optional)</span>`, answers:[w.l], model:w.l});
    });
    ty({id:`v7:${w.key}:type`, tag:'v-type', lvls:[3,5], section:'vocab', pattern:'vocab: type the English', ckey:'vocab:'+w.key, label:`${w.l} (${w.s.join(' / ')})`, why:whyW,
      q:`Type the English for ${L(w.l)}${multi?' <span class="hint">(it has two meanings. Either one is fine.)</span>':''}`, answers:w.answers, model:w.s.join(' or ')});
    if(strip(w.l).length>=4){
      ty({id:`v7:${w.key}:scr`, tag:'v-scr', lvls:[4], section:'vocab', pattern:'vocab: unscramble the Latin', ckey:'vocab:'+w.key+':0', label:`${w.s[0]} = ${w.l}`, why:whyW, form:false, diff:1,
        q:`Unscramble the letters to spell the Latin word for <b>${esc(w.s[0])}</b>:<div class="latq">${esc(scramble(w.l))}</div>`, answers:[w.l], model:w.l});
    }
    if(multi){
      mc({id:`v7:${w.key}:mean`, tag:'v-mean', lvls:[2], section:'vocab', diff:2, pattern:'vocab: two meanings', ckey:'vocab:'+w.key, label:`${w.l} has two meanings`, why:whyW,
        q:`${L(w.l)} is ONE Latin word with TWO English meanings. Which pair is right?`, answer:w.s.join(' or '),
        options:()=>{ const others=shuffle(V.filter(x=>x!==w && x.s.length>1)); const o=others.slice(0,2).map(x=>x.s.join(' or '));
          o.push(w.s[0]+' or '+others[2].s[1]); return [w.s.join(' or '),...o]; }});
    }
    if(w.p && strip(w.p)!==strip(w.l)){
      mc({id:`v7:${w.key}:pair`, tag:'v-pair', lvls:[2], section:'vocab', diff:2, pattern:'vocab: the perfect form on the checklist', ckey:'pair7:'+w.key, label:`${w.l}: ${w.p}`, why:`The checklist lists two forms. ${w.l} (${w.pe}) goes with ${w.p} (${w.pa}).`,
        q:`${L(w.l)} means <b>${esc(w.pe)}</b>. Which word is its <b>perfect tense</b> (the past action, he/she/it <b>${esc(w.pa)}</b>)?`, answer:w.p,
        options:()=>{ const oth=shuffle(V.filter(x=>x.p && x!==w)); return [w.p,w.pl,oth[0].p,oth[1].p]; }});
      ty({id:`v7:${w.key}:pairt`, tag:'v-pairt', lvls:[5], section:'vocab', pattern:'vocab: type the perfect form', ckey:'pair7:'+w.key, label:`${w.l}: ${w.p}`, why:`${w.l} (${w.pe}) goes with ${w.p} (${w.pa}).`, form:false,
        q:`Type the <b>perfect tense</b> of ${L(w.l)} (the past action: he/she/it <b>${esc(w.pa)}</b>) <span class="hint">(macrons are optional)</span>`, answers:[w.p], model:w.p});
      ty({id:`v7:${w.key}:pairm`, tag:'v-pairm', lvls:[5], section:'vocab', pattern:'vocab: what the perfect form means', ckey:'pair7:'+w.key, label:`${w.p}: ${w.pa}`, why:`${w.p} is the perfect tense of ${w.l}. It means ${w.pa} (he/she/it ${w.pa}).`, form:false,
        q:`${L(w.p)} is the <b>perfect tense</b> of ${L(w.l)}. What does ${L(w.p)} mean in English?`, answers:[w.pa,'he '+w.pa,'she '+w.pa,'it '+w.pa], model:'he/she/it '+w.pa});
    }
  });

  // recall words from earlier stages
  R.forEach(r=>{
    const acc=new Set([r.e,...r.x]); if(r.k==='verb'){ [r.e,...r.x].forEach(v=>['he','she','it','he/she/it'].forEach(p=>acc.add(p+' '+v))); }
    const why=`${r.l} means "${r.e}". (Stage ${r.st} word)`;
    const base={ckey:'recall:'+r.key, label:`${r.l} (${r.e}) from Stage ${r.st}`, why};
    mc(Object.assign({}, base, {id:`r7:${r.key}:l2e`, tag:'r-l2e', lvls:[1], section:'vocab', diff:1, pattern:'recall: Latin to English',
      q:`<span class="two">Review, Stage ${r.st}</span><br>What does ${L(r.l)} mean?`, answer:r.e, options:()=>opts(r.e,r.k,ENG_POOL,new Set([r.e,...r.x]))}));
    mc(Object.assign({}, base, {id:`r7:${r.key}:e2l`, tag:'r-e2l', lvls:[2], section:'vocab', diff:2, pattern:'recall: English to Latin',
      q:`<span class="two">Review, Stage ${r.st}</span><br>Which Latin word means <b>${esc(r.e)}</b>?`, answer:r.l, options:()=>opts(r.l,r.k,LAT_POOL,new Set([r.l]))}));
    ty(Object.assign({}, base, {id:`r7:${r.key}:type`, tag:'r-type', lvls:[3,5], section:'vocab', pattern:'recall: type the English', form:false,
      q:`<span class="two">Review, Stage ${r.st}</span><br>Type the English for ${L(r.l)}`, answers:[...acc], model:r.e}));
    ty(Object.assign({}, base, {id:`r7:${r.key}:t2l`, tag:'r-t2l', lvls:[4,5], section:'vocab', pattern:'recall: type the Latin', form:false,
      q:`<span class="two">Review, Stage ${r.st}</span><br>Type the Latin for <b>${esc(r.e)}</b> <span class="hint">(macrons are optional)</span>`, answers:[r.l], model:r.l}));
  });

  // ----- grammar: present and perfect pairs
  const PAIRS = V.filter(w=>w.p).map(w=>({l:w.l,p:w.p,pl:w.pl,pe:w.pe,pa:w.pa})).concat(C.bookPairs);
  PAIRS.forEach((pr,idx)=>{
    const irregular = pr.p !== pr.l.slice(0,-2)+'āvit' && pr.p !== pr.l.slice(0,-2)+'vit';
    const fake = pr.l.slice(0,-2)+'āvit';
    const others = ()=>shuffle(PAIRS.filter(x=>x!==pr));
    const macronOnly = strip(pr.l)===strip(pr.p);
    mc({id:`g7:pair:${idx}`, tag:'g-pair', lvls:[6], section:'grammar', diff:2, pattern:'perfect: match the present to its perfect', ckey:'gpair:'+idx, label:`${pr.l} / ${pr.p}`,
      q:`Which is the PERFECT form (he/she/it ${esc(pr.pa)}) that goes with ${L(pr.l)} (${esc(pr.pe)})?`, answer:pr.p,
      options:()=>{ const o=others(); const arr=[pr.p,pr.pl,o[0].p]; arr.push(irregular && strip(fake)!==strip(pr.p) ? fake : o[1].p); return arr; },
      why:`${pr.l} (${pr.pe}) goes with ${pr.p} (${pr.pa}).${irregular?' This perfect changes the stem, so you have to learn it.':''}${macronOnly?' Only the macron tells venit (comes) from vēnit (came).':''}`});
    mc({id:`g7:plural:${idx}`, tag:'g-plural', lvls:[6], section:'grammar', diff:2, pattern:'perfect: one or many', ckey:'gplur:'+idx, label:`${pr.pl} (they ${pr.pa})`,
      q:`Which one means <b>they ${esc(pr.pa)}</b>?`, answer:pr.pl,
      options:()=>[pr.pl,pr.p,pr.l,others()[0].pl],
      why:`-ērunt at the end means THEY (more than one). ${pr.p} is just one (he/she/it ${pr.pa}), and ${pr.l} is the present (${pr.pe}).`});
    [['pres',pr.l],['sing',pr.p],['plur',pr.pl]].forEach(([w,form])=>{
      const isPres = w==='pres';
      mc({id:`g7:tense:${idx}:${w}`, tag:'g-tense', lvls:[6], section:'grammar', diff:1, pattern:'perfect: present or perfect', ckey:`gten:${idx}:${w}`, label:`${form}: ${isPres?'present':'perfect'}`,
        q:`Is ${L(form)} Present or Perfect?${macronOnly?' <span class="hint">(look at the macron)</span>':''}`, answer:isPres?'Present (happening now)':'Perfect (finished)',
        options:()=>['Present (happening now)','Perfect (finished)'],
        why:isPres?`${form} is the Present: ${pr.pe}. It is the first form on the checklist.`:`${form} is the Perfect: ${w==='plur'?'they ':'he/she/it '}${pr.pa}. It is a finished action.${macronOnly?' The macron in vēnit is the clue.':''}`});
    });
  });

  // ----- grammar: missing subjects (pairs) and translation
  PAIRS7.forEach(p=>{
    const ans = [...new Set(p.en1.flatMap(e1=>p.rest.flatMap(r=>[`${e1} ${p.pron} ${fill(r,p.pron)}`, `${e1} ${p.noun} ${fill(r,p.pron)}`])))];
    const model = `${p.en1[0]}. ${cap(p.pron)} ${fill(p.mainRest,p.pron)}.`;
    const tokens = stripP(model).split(' ');
    const lat = `<div class="latq">${esc(p.l1)} ${esc(p.l2)}</div>`;
    const whoWhy = `The second sentence has no subject word. The first sentence is about ${p.noun}, so the doer is "${p.pron}". ${p.pron==='they'?'The verb ends in -nt, which also says it is more than one.':'The verb ends in -t, which says it is just one.'}`;
    mc({id:`g7:who:${p.id}`, tag:'g-who', lvls:[7], section:'grammar', diff:1, pattern:'missing subject: who is it', ckey:'sent:'+p.id, label:`${p.l2} (${p.pron})`, why:whoWhy,
      q:`${lat}The SECOND sentence has no subject word. Who is doing it?`, answer:p.pron, options:()=>['he','she','they']});
    mc({id:`g7:pick:${p.id}`, tag:'g-pick', lvls:[7], section:'grammar', diff:2, pattern:'missing subject: pick the English', ckey:'sent:'+p.id, label:`${p.l2}`, why:whoWhy+` So: ${cap(p.pron)} ${fill(p.mainRest,p.pron)}.`,
      q:`${lat}Which English matches the SECOND sentence?`, answer:`${cap(p.pron)} ${fill(p.mainRest,p.pron)}.`,
      options:()=>['he','she','they'].map(x=>`${cap(x)} ${fill(p.mainRest,x)}.`)});
    tl({id:`g7:tilesP:${p.id}`, tag:'g-tiles', lvls:[7], pattern:'translate: build the sentences', ckey:'sent:'+p.id, label:model, why:whoWhy,
      q:`Build the English:${lat}<div class="hint">Helpful words: ${esc(p.gloss)}</div>`, tokens, bank:tokens.concat(p.distract), answers:ans, model});
    ty({id:`g7:typedP:${p.id}`, tag:'g-typed', lvls:[8], pattern:'translate: type the sentences', ckey:'sent:'+p.id, label:model, why:whoWhy, form:false,
      q:`Translate into English:${lat}<div class="hint">Helpful words: ${esc(p.gloss)}</div>`, answers:ans, model});
  });
  SING7.forEach(s=>{
    const model = s.en[0]+'.';
    const tokens = stripP(s.en[0]).split(' ');
    const lat = `<div class="latq">${esc(s.l)}</div>`;
    const why = `Read the verb from the right: the ending shows who (one or many), then the tense, then the meaning. Model answer: ${model}`;
    tl({id:`g7:tiles:${s.id}`, tag:'g-tiles', lvls:[8], pattern:'translate: build the sentence', ckey:'sent:'+s.id, label:model, why,
      q:`Build the English:${lat}<div class="hint">Helpful words: ${esc(s.gloss)}</div>`, tokens, bank:tokens.concat(s.d), answers:s.en, model});
    ty({id:`g7:typed:${s.id}`, tag:'g-typed', lvls:[8], pattern:'translate: type the sentence', ckey:'sent:'+s.id, label:model, why, form:false,
      q:`Translate into English:${lat}<div class="hint">Helpful words: ${esc(s.gloss)}</div>`, answers:s.en, model});
  });

  // ----- English to Latin sentences. ch = chunks before the verb (they can swap places; a preposition stays with its noun). v = the verb, last.
  const ESENT7 = [
    {id:'e1',en:'The merchant dined yesterday.',ch:['mercātor','heri'],v:'cēnāvit',help:'merchant = mercātor, yesterday = heri, dined = cēnāvit',d:['cēnat','mercātōrem']},
    {id:'e2',en:'The centurion caught sight of the ghost.',ch:['centuriō','umbram'],v:'cōnspexit',help:'centurion = centuriō, ghost = umbra, caught sight of = cōnspexit',d:['umbra','cōnspicit']},
    {id:'e3',en:'The slave-girl prepared the cup.',ch:['ancilla','pōculum'],v:'parāvit',help:'slave-girl = ancilla, cup = pōculum, prepared = parāvit',d:['parat','pōculī']},
    {id:'e4',en:'The master asked the slave-girl.',ch:['dominus','ancillam'],v:'rogāvit',help:'master = dominus, slave-girl = ancilla, asked = rogāvit',d:['rogat','ancilla']},
    {id:'e5',en:'The girl wept quietly.',ch:['puella','tacitē'],v:'lacrimāvit',help:'girl = puella, quietly = tacitē, wept = lacrimāvit',d:['lacrimat','puellam']},
    {id:'e6',en:'The shadow frightened the merchant.',ch:['umbra','mercātōrem'],v:'terruit',help:'shadow = umbra, merchant = mercātor, frightened = terruit',d:['terret','mercātor']},
    {id:'e7',en:'The old man understood nothing.',ch:['senex','nihil'],v:'intellēxit',help:'old man = senex, nothing = nihil, understood = intellēxit',d:['intellegit','senem']},
    {id:'e8',en:'The young man told the story.',ch:['iuvenis','fābulam'],v:'nārrāvit',help:'young man = iuvenis, story = fābula, told = nārrāvit',d:['nārrat','fābula']},
    {id:'e9',en:'The centurion killed the lion.',ch:['centuriō','leōnem'],v:'necāvit',help:'centurion = centuriō, lion = leō, killed = necāvit',d:['necat','leō']},
    {id:'e10',en:'The merchants dined.',ch:['mercātōrēs'],v:'cēnāvērunt',help:'merchant = mercātor (many: -ēs), dined = cēnāvit (many: -ērunt)',d:['cēnāvit','mercātor']},
    {id:'e11',en:'The slave-girls greeted the master.',ch:['ancillae','dominum'],v:'salūtāvērunt',help:'slave-girl = ancilla, master = dominus, greeted = salūtāvit',d:['salūtāvit','ancilla']},
    {id:'e12',en:'The friends prepared dinner.',ch:['amīcī','cēnam'],v:'parāvērunt',help:'friend = amīcus, dinner = cēna, prepared = parāvit',d:['parāvit','amīcus']},
    {id:'e13',en:'Grumio dined with the cook.',ch:['Grumiō','cum coquō'],v:'cēnāvit',help:'cook = coquus, with = cum (the noun after it ends in -ō)',d:['coquus','cēnat']},
    {id:'e14',en:'The ghost was near the house.',ch:['umbra','prope vīllam'],v:'erat',help:'near = prope (the noun after it ends in -m), house = vīlla, was = erat',d:['vīlla','est']}
  ];
  const perms = a => a.length<=1?[a]:a.flatMap((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).map(r=>[x,...r]));
  ESENT7.forEach(s=>{
    const ans = perms(s.ch).map(c=>c.join(' ')+' '+s.v);
    const model = s.ch.join(' ')+' '+s.v+'.';
    const tokens = (s.ch.join(' ')+' '+s.v).split(' ');
    const prompt = `<div class="latq" style="font-style:normal;font-family:inherit">${esc(s.en)}</div>`;
    const why = `Subject first, verb last. The doer takes the plain form, the thing it acts on takes the -m form, and the verb ending shows one (-t) or many (-nt). Model answer: ${model}`;
    tl({id:`g7:e2lt:${s.id}`, tag:'g-lat-tiles', lvls:[9], pattern:'English to Latin: build the sentence', ckey:'sentE:'+s.id, label:model, why,
      q:`Build the Latin:${prompt}<div class="hint">Helpful words: ${esc(s.help)}</div>`, tokens, bank:tokens.concat(s.d), answers:ans, model});
    ty({id:`g7:e2ly:${s.id}`, tag:'g-lat-typed', lvls:[9], pattern:'English to Latin: type the sentence', ckey:'sentE:'+s.id, label:model, why, form:false,
      q:`Write it in Latin:${prompt}<div class="hint">Helpful words: ${esc(s.help)}. Macrons are optional. Latin usually puts the verb last.</div>`, answers:ans, model});
  });

  // ----- levels
  const vtable = ()=>`<div class="wide"><table class="chart"><tr><th>Latin</th><th>English</th><th>Hook</th></tr>${C.vocab.map(w=>`<tr><td class="lat">${esc(w.l)}${w.p?`<br><span class="tiny">${esc(w.p)}</span>`:''}</td><td>${esc(w.s.join(' or '))}${w.s.length>1?'<span class="two">2 meanings</span>':''}</td><td>${esc(w.h)}</td></tr>`).join('')}</table></div>`;
  LEVELS = [
    {id:1,group:'Part 1: Vocabulary',title:'Meet the words',sub:'Stage 7 words: pick the English meaning',spell:'none',quota:{'v-l2e':8,'r-l2e':2},
      teach:()=>`<p>These are the 26 Stage 7 words. Read each one out loud. Verbs show a second word under the Latin. That second word is the <b>perfect tense</b>, the past action (he/she/it did it), and you will use it later.</p>
        <p><b>Some English words share one Latin word.</b> <span class="lat">umbra</span> is the Latin for <b>ghost</b> AND for <b>shadow</b>. In the questions, you will see each English meaning on its own.</p>${vtable()}
        <p class="tiny">About 2 of the 10 questions are review words from Stages 2 to 6.</p>`},
    {id:2,group:'Part 1: Vocabulary',title:'Say it in Latin',sub:'English to Latin, one meaning at a time',spell:'none',quota:{'v-e2l':5,'v-mean':2,'v-pair':1,'r-e2l':2},
      teach:()=>`<p>Now go the other direction: you see the English and pick the Latin.</p>
        <p><b>Ghost</b> is one question and <b>shadow</b> is another question. The answer to both is <span class="lat">umbra</span>. Same idea for these:</p>
        <ul>${C.vocab.filter(w=>w.s.length>1).map(w=>`<li><span class="lat">${esc(w.l)}</span> = ${esc(w.s.join(' AND '))}</li>`).join('')}</ul>
        <p>There will also be a question about the <b>perfect tense</b> of a verb. That is the past-action form listed next to it on the checklist, like <span class="lat">cēnat</span> (dines) and <span class="lat">cēnāvit</span> (dined).</p>`},
    {id:3,group:'Part 1: Vocabulary',title:'Type the English',sub:'Your first typing. Close spelling still counts',spell:'lenient',quota:{'v-type':8,'r-type':2},

function guide7(){
  return `<div class="tense"><b>The perfect tense</b> tells about a <b>finished action</b>: he <b>said</b>, they <b>came</b>. In your Stage 6 guide this was called the "Past-Perfect." Your Stage 7 book calls it the <b>perfect</b>. It is the same tense.</div>
  <p>In Stage 6 you met the regular kind: <span class="lat">ambulāvit</span> (-vit) and <span class="lat">ambulāvērunt</span> (-vērunt). Some verbs <b>change inside</b> instead:</p>
  <div class="wide"><table class="chart"><tr><th>Present</th><th>Perfect (one)</th><th>Perfect (they)</th><th>English</th></tr>
  ${[['appāret','appāruit','appāruērunt','appeared'],['dīcit','dīxit','dīxērunt','said'],['discēdit','discessit','discessērunt','left'],['facit','fēcit','fēcērunt','made'],['capit','cēpit','cēpērunt','took'],['venit','vēnit','vēnērunt','came']].map(r=>`<tr><td class="lat">${r[0]}</td><td class="lat">${r[1]}</td><td class="lat">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>
  <ul><li><b>One doer</b> ends in -it. <b>Many doers</b> end in -ērunt.</li><li>English does this too: send / sent, give / gave, run / ran, come / came, read / read.</li><li>Careful: <span class="lat">venit</span> (comes) and <span class="lat">vēnit</span> (came) differ only by the macron.</li><li>Your checklist now lists each verb in <b>two forms</b>: present, then perfect (<span class="lat">cēnat: cēnāvit</span>).</li></ul>`;
}
function noSubject7(){
  return `<div class="tense pres"><b>Latin does not need a word for he, she, or they.</b><br>The verb already says who: -t = one doer, -nt = many doers.</div>
  <p><span class="lat">mercātor Caecilium vīsitābat. vīllam intrāvit.</span><br><i>A merchant was visiting Caecilius. <b>He</b> entered the house.</i></p>
  <p><span class="lat">amīcī cum Caeciliō cēnābant. coquum laudāvērunt.</span><br><i>Friends were dining with Caecilius. <b>They</b> praised the cook.</i></p>
  <ul><li>When the second sentence has no subject, <b>look back at the first sentence</b> to find who.</li><li><span class="lat">intrāvit</span> can mean he entered OR she entered. The story tells you which.</li></ul>`;
}

  const hooks = V.some(w=>w.h);

const Snd=(()=>{

    notes.forEach(([f,t0,dur,type,vol])=>{ const s0=Math.floor(t0*RATE), n=Math.floor(dur*RATE);
      for(let i=0;i<n&&s0+i<N;i++){ const t=i/RATE, a=Math.min(1,t/.012)*Math.pow(1-i/n,1.6); const ph=2*Math.PI*f*t;
        const w=type==='triangle'?(2/Math.PI)*Math.asin(Math.sin(ph)):Math.sin(ph); buf[s0+i]+=w*a*(vol||.2) } });
    const b=new ArrayBuffer(44+N*2), v=new DataView(b); const W=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    W(0,'RIFF');v.setUint32(4,36+N*2,true);W(8,'WAVE');W(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,RATE,true);v.setUint32(28,RATE*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);W(36,'data');v.setUint32(40,N*2,true);
    for(let i=0;i<N;i++){ const x=Math.max(-1,Math.min(1,buf[i])); v.setInt16(44+i*2,x*32767,true) }
    let bin=''; const u=new Uint8Array(b); for(let i=0;i<u.length;i+=4096) bin+=String.fromCharCode.apply(null,u.subarray(i,i+4096));
    return 'data:audio/wav;base64,'+btoa(bin);
  }
  const defs={
    ok:s=>{ const n=Math.max(s||1,1), f=523.25*Math.pow(2,Math.min(n-1,14)*2/12), v=n>=12?.2:.3; const a=[[f,0,.16,'sine',v],[f*1.5,.09,.26,'sine',v]]; if(n>=4) a.push([f*2,.18,.3,'sine',v*.7]); if(n>=7) a.push([f*3,.27,.34,'sine',v*.5]); return a },
    close:()=>[[440,0,.15,'triangle',.25],[494,.1,.22,'triangle',.25]],

    star:i=>{ const f=784*Math.pow(1.122,i||0); return [[f,0,.24,'sine',.24],[f*2,.05,.2,'sine',.1]] },
    win:()=>[523.25,659.25,783.99,1046.5].map((f,i)=>[f,i*.12,.3,'sine',.3]),
    soft:()=>[[392,0,.2,'sine',.22],[330,.16,.32,'sine',.22]]
  };
  function ensurePool(){ if(pool.length||typeof Audio==='undefined') return; for(let i=0;i<3;i++){ try{ const a=new Audio(); a.preload='auto'; a.setAttribute('playsinline',''); pool.push(a) }catch(e){} } }
  // a very short silent clip used to "unlock" each audio element on the first touch
  const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=';
  function unlock(){
    if(unlocked) return; ensurePool();
    try{ pool.forEach((a,i)=>{ a._s=1; a.src=SILENT; const p=a.play(); if(p&&p.then) p.then(()=>{ if(a._s) a.pause(); if(i===0) unlocked=true }).catch(()=>{}) }) }catch(e){}
    try{ const A=window.AudioContext||window.webkitAudioContext; if(A&&!ctx){ ctx=new A() } if(ctx&&ctx.state==='suspended') ctx.resume() }catch(e){}
  }
  function viaCtx(notes){ try{ if(!ctx) return; if(ctx.state==='suspended') ctx.resume(); notes.forEach(([f,t0,dur,type,vol])=>{ const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+t0; o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+.05) }) }catch(e){} }
  function play(name,arg){
    if(muted) return; if(!unlocked) unlock();
    const key=name+':'+(arg==null?'':arg); const notes=defs[name](arg);
    try{
      if(!cache[key]) cache[key]=wav(notes);
      ensurePool(); if(!pool.length){ viaCtx(notes); return }
      const a=pool[pi++%pool.length]; a._s=0; a.pause(); a.src=cache[key]; a.volume=1;
      const p=a.play(); if(p&&p.catch) p.catch(()=>viaCtx(notes));
    }catch(e){ viaCtx(notes) }
  }
  const api={
    unlock, isMuted(){ return muted },
    toggle(){ muted=!muted; try{ localStorage.setItem('lily-latin-mute',muted?'1':'0') }catch(e){} if(!muted){ unlock(); play('ok',1) } return muted },
    ok(s){ play('ok',s) }, close(){ play('close') }, bad(){ play('bad') }, star(i){ play('star',i) }, win(){ play('win') }, soft(){ play('soft') }
  };
  return api;
})();

// ---------- selecting an attempt
function selectAttempt(lvlId){
  const cfg = LEVELS.find(l=>l.id===lvlId);
  const recent = new Set([].concat(...(save.recent[lvlId]||[])));
  const chosen=[], ids=new Set(), ck=new Set(); const taken={};
  const lvlItems = ITEMS.filter(it=>it.lvls.includes(lvlId) && cfg.quota[it.tag]!=null);
  const take = (it, strict) => { if(!it||ids.has(it.id)) return false; if(strict && ck.has(it.ckey)) return false; ids.add(it.id); ck.add(it.ckey); chosen.push(it); taken[it.tag]=(taken[it.tag]||0)+1; return true };
  // up to 3 review items from words missed earlier
  let rev=0;
  for(const k of shuffle(Object.keys(save.carry))){
    if(rev>=3) break;
    const c = lvlItems.filter(it=>it.ckey===k && !ids.has(it.id) && (taken[it.tag]||0)<cfg.quota[it.tag]);
    if(c.length && take(pick(c),true)) rev++;
  }
  Object.keys(cfg.quota).forEach(tag=>{
    const need = cfg.quota[tag]-(taken[tag]||0); if(need<=0) return;
    const cands = shuffle(lvlItems.filter(it=>it.tag===tag && !ids.has(it.id)));
    const order = cands.filter(it=>!recent.has(it.id)).concat(cands.filter(it=>recent.has(it.id)));
    let n=0; for(const it of order){ if(n>=need) break; if(take(it,true)) n++; }
    for(const it of order){ if(n>=need) break; if(take(it,false)) n++; }
  });
  // short word lists: top up so a try always has the full number of questions
  if(chosen.length<C.perTry){ const rest=shuffle(lvlItems); for(const it of rest){ if(chosen.length>=C.perTry) break; take(it,true) } for(const it of rest){ if(chosen.length>=C.perTry) break; take(it,false) } }
  let list = shuffle(chosen);
  const fi = list.findIndex(it=>it.diff===1); if(fi>0){ const [e]=list.splice(fi,1); list.unshift(e) }
  return list.slice(0,C.perTry);
}
function retryFor(it, usedIds){
  let c = ITEMS.filter(x=>x.kind==='mc' && x.pattern===it.pattern && x.id!==it.id && !usedIds.has(x.id));
  return c.length? pick(c) : null;
}

function cardsFor(ids,dir){

function chartTable(heads, grid){
  const lab=['nominative','accusative','nominative','accusative'], span=heads.length+1;
  const row=r=>`<tr><th class="rl"><i>${lab[r]}</i></th>${grid[r].map(x=>`<td>${x}</td>`).join('')}</tr>`;
  return `<div class="wide"><table class="chart ctab"><tr><th></th>${heads.map(h=>`<th>${h}</th>`).join('')}</tr><tr><th colspan="${span}" class="grpr">Singular</th></tr>${row(0)}${row(1)}<tr><th colspan="${span}" class="grpr">Plural</th></tr>${row(2)}${row(3)}</table></div>`;
}
// fill in the whole chart: the nominative singular is given, Lily types the other 9 boxes
let cdr=null;
function chartDrill(mode){
  const decls=S.chart.decls;
  cdr={mode, nouns:decls.map(d=> mode==='new' ? pick(d.nouns.slice(1)) : d.nouns[0])};
  const heads=cdr.nouns.map((n,c)=>`${esc(decls[c].name)}<br><span class="lat">${esc(n[0])}</span> <span class="tiny">(${esc(n[4])})</span>${c===2&&mode==='new'?`<br><span class="tiny">stem: ${esc(n[1].slice(0,-2))}-</span>`:''}`);
  const grid=[0,1,2,3].map(r=>cdr.nouns.map((n,c)=> r===0 ? `<span class="lat">${esc(n[0])}</span>` :
    `<input class="cin" data-r="${r}" data-c="${c}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" aria-label="${['','accusative singular','nominative plural','accusative plural'][r]} of ${esc(n[0])}"><div class="cfix"></div>`));
  app.innerHTML=`<header><button class="link" id="back">&larr; ${esc(S.title)}</button><h1>Fill in the chart</h1>
    <p class="sub">${mode==='new'?'New nouns, same patterns. Use the endings you know from the book chart.':'This is the chart from your book. The top row is filled in. Type the other boxes.'} Macrons are optional.</p></header>
    <div class="card"><div class="mac" id="cmac"><span>Tap to add:</span>${['ā','ē','ī','ō','ū'].map(c=>`<button type="button" data-c="${c}">${c}</button>`).join('')}</div>${chartTable(heads,grid)}</div>
    <div id="cres"></div><p><button class="primary" id="ccheck">Check my chart</button></p>`;
  const ins=[...app.querySelectorAll('.cin')]; let last=ins[0];
  ins.forEach((i,k)=>{ i.onfocus=()=>{ last=i }; i.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const nx=ins[k+1]; if(nx) nx.focus(); else chartCheck() } } });
  app.querySelectorAll('#cmac button').forEach(b=>{ b.addEventListener('mousedown',e=>e.preventDefault()); b.onclick=()=>{ if(!last||last.disabled) return; const s0=last.selectionStart??last.value.length, e0=last.selectionEnd??s0; last.value=last.value.slice(0,s0)+b.dataset.c+last.value.slice(e0); last.focus(); try{ last.setSelectionRange(s0+1,s0+1) }catch(x){} } });
  $('#back').onclick=home; $('#ccheck').onclick=chartCheck; window.scrollTo(0,0);
}
function chartCheck(){
  const ins=[...app.querySelectorAll('.cin')]; if(ins[0].disabled) return;
  const miss={1:0,2:0,3:0}; let got=0;
  ins.forEach(i=>{ const r=+i.dataset.r, want=cdr.nouns[+i.dataset.c][r], ok=i.value.trim()!=='' && strip(i.value.trim())===strip(want);
    i.disabled=true; i.classList.add(ok?'right':'wrong'); if(ok) got++; else { miss[r]++; i.nextElementSibling.innerHTML=`<span class="lat">${esc(want)}</span>` } });
  const n=ins.length, st=got===n?3:got>=n-1?2:got>=n-3?1:0;
  addSkill('The chart',got,n); const cb=save.chartBest=save.chartBest||{}; cb[cdr.mode]=Math.max(cb[cdr.mode]||0,got); persist();
  const tips=[miss[1]?'<li><b>Accusative singular</b> always ends in <b>-m</b>: -am, -um, -em.</li>':'', miss[2]?'<li><b>Nominative plural</b> (more than one doer): -ae, -ī, -ēs.</li>':'', miss[3]?'<li><b>Accusative plural</b> (more than one, receiving the action): -ās, -ōs, -ēs.</li>':''].join('');
  $('#cres').innerHTML=`<div class="card score ${got===n?'pass':''}"><div class="bigstars">${starRow(st)}</div><div class="big">${got} / ${n}</div>${tips?`<ul>${tips}</ul>`:'<p>Every box right!</p>'}</div>`;
  $('#ccheck').outerHTML=`<span><button class="primary" id="cnew">Try new nouns</button> <button id="cbook">Book chart again</button> <button id="chome">${esc(S.title)}</button></span>`;
  $('#cnew').onclick=()=>chartDrill('new'); $('#cbook').onclick=()=>chartDrill('book'); $('#chome').onclick=home;
  if(got===n) Snd.win(); else Snd.soft(); for(let k=0;k<st;k++) setTimeout(()=>Snd.star(k),450+k*400);
  $('#cres').scrollIntoView({behavior:'smooth',block:'start'});
}

function ask(msg,yes,fn){
  const old=$('#askbox'); if(old) old.remove();
  const d=document.createElement('div'); d.id='askbox'; d.className='fb bad';
  d.innerHTML=`<b>${esc(msg)}</b><p><button class="primary" id="ay">${esc(yes)}</button> <button id="an">Stay</button></p>`;
  app.insertBefore(d, app.firstChild); window.scrollTo(0,0);
  $('#ay').onclick=fn; $('#an').onclick=()=>d.remove();
}

function guide(){
  app.innerHTML = `<header><button class="link" id="back">&larr; Levels</button><h1>${esc(S.guideTitle)}</h1></header><div class="card teach">${tenseGuideHTML()}${bankHTML('all')}</div><p><button id="back2">Back to levels</button></p>`;
  $('#back').onclick=home; $('#back2').onclick=home; window.scrollTo(0,0);
}
function teach(lvlId){
  const l=LEVELS.find(x=>x.id===lvlId);
  app.innerHTML = `<header><button class="link" id="back">&larr; Levels</button><h1>Level ${l.id}: ${esc(l.title)}</h1><span class="badge">${esc(SPELL[l.spell])}</span></header><div class="card teach">${l.teach()}</div>
    <p><button class="primary" id="go">I'm ready. Start the ${C.perTry} questions</button></p>`;
  $('#back').onclick=home; $('#go').onclick=()=>start(lvlId); window.scrollTo(0,0);
}
function start(lvlId){
  const items = selectAttempt(lvlId);
  run={lvl:lvlId, items, i:0, score:0, sec:{}, missed:[], close:[], used:new Set(items.map(x=>x.id)), marks:[], streak:0};
  question();
}
function optionsOf(it){ return shuffle(Array.from(new Set(it.options()))) }
function starsHTML(popIdx){
  const n=run.items.length;
  let h=''; for(let k=0;k<n;k++){ const m=run.marks[k]; h+=`<span class="st ${m||''}${k===popIdx?' pop':''}" aria-hidden="true">&#9733;</span>`; }
  return h+`<span class="passline">${C.passScore} of ${n} to pass</span>`;
}
function question(){
  const it = run.items[run.i], n=run.items.length;
  run.cur = {it, answered:false};
  const bm = it.bankMode ? it.bankMode(run.lvl) : 'none';
  app.innerHTML = `<header><button class="link" id="back">&larr; Levels</button><div class="meta">Level ${run.lvl} &middot; Question ${run.i+1} of ${n}</div>${bar(run.i,n)}<div class="stars" id="stars" role="img" aria-label="${run.marks.filter(m=>m==='on').length} stars so far">${starsHTML()}</div></header>
    <div class="card q"><div class="qtext">${it.q}</div>${bankHTML(bm)}<div id="ans"></div></div><div id="fb"></div>`;
  $('#back').onclick=()=>ask('Leave this try? Your answers so far will not count.','Leave',home);
  renderAnswer(it, $('#ans'), res=>grade(res));
  window.scrollTo(0,0);
}
function macroBar(inp){
  const d=document.createElement('div'); d.className='mac';
  d.innerHTML='<span>Tap to add:</span>'+['ā','ē','ī','ō','ū'].map(c=>`<button type="button" data-c="${c}">${c}</button>`).join('');
  d.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e);inp.focus();const p=s+1;try{inp.setSelectionRange(p,p)}catch(x){}});
  return d;
}
function typedInput(box, onGo, btnLabel){
  box.innerHTML = `<input type="text" class="typed" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" placeholder="Type your answer"><button class="primary" type="button" id="chk">${btnLabel||'Check'}</button>`;
  const inp=$('.typed',box); box.insertBefore(macroBar(inp), inp);
  const go=()=>{ if(box.dataset.done) return; if(!inp.value.trim()) return; onGo(inp,box) };
  $('#chk',box).onclick=go; inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  return inp;
}

function renderAnswer(it, box, done){
  if(it.kind==='mc'){
    const opts=optionsOf(it);
    box.innerHTML = opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(box.dataset.done) return; box.dataset.done=1;
      const ok = opts[+b.dataset.i]===it.answer;
      box.querySelectorAll('.opt').forEach(x=>{ if(opts[+x.dataset.i]===it.answer) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      done(ok?'exact':'wrong', opts[+b.dataset.i]);
    });
  } else if(it.kind==='tiles'){
    const bank=shuffle(it.bank.map((t,i)=>({t,i,used:false})));
    let chosen=[];
    box.innerHTML=`<div class="tslot" aria-label="your sentence"></div><div class="tbank"></div><button class="primary" type="button" id="chk">Check</button>`;
    const slot=$('.tslot',box), bk=$('.tbank',box);
    const draw=()=>{
      slot.innerHTML=''; bk.innerHTML='';
      chosen.forEach(o=>{ const b=document.createElement('button'); b.type='button'; b.className='tile'; b.textContent=o.t; b.onclick=()=>{ if(box.dataset.done) return; o.used=false; chosen=chosen.filter(x=>x!==o); draw() }; slot.appendChild(b) });
      bank.forEach(o=>{ const b=document.createElement('button'); b.type='button'; b.className='tile'+(o.used?' gone':''); b.textContent=o.t; b.disabled=o.used; b.onclick=()=>{ if(box.dataset.done||o.used) return; o.used=true; chosen.push(o); draw() }; bk.appendChild(b) });
    };
    draw();
    $('#chk',box).onclick=()=>{ if(box.dataset.done||!chosen.length) return; box.dataset.done=1;
      const txt=chosen.map(o=>o.t).join(' '); const ok=it.answers.some(a=>norm(a)===norm(txt));
      slot.classList.add(ok?'right':'wrong'); box.querySelectorAll('.tile').forEach(b=>b.disabled=true); done(ok?'exact':'wrong', txt) };
  } else {
    const inp = typedInput(box,(inp,bx)=>{ bx.dataset.done=1; inp.disabled=true; const res=judgeText(inp.value,it.answers,{form:it.form}); inp.classList.add(res==='exact'?'right':res==='close'?'close':'wrong'); done(res, inp.value) });
    setTimeout(()=>{try{inp.focus()}catch(e){}},50);
  }
}
function correctText(it){ return it.kind==='mc'? it.answer : it.model }
function points(res, spell){ if(res==='exact') return 1; if(res==='close') return spell==='lenient'?1:spell==='half'?.5:0; return 0 }
function grade(res){
  const it=run.cur.it; run.cur.answered=true;
  const lvl=LEVELS.find(l=>l.id===run.lvl);
  const pts = points(res, lvl.spell);
  const s=run.sec[it.section]=run.sec[it.section]||{r:0,n:0}; s.n++; s.r+=pts; run.score+=pts;
  // stars and sound
  run.marks[run.i] = res==='exact' ? 'on' : (pts>0 ? 'half' : 'miss');
  if(res==='exact'){ run.streak++; Snd.ok(run.streak) } else if(res==='close'){ run.streak=0; Snd.close() } else { run.streak=0; Snd.bad() }
  const sb=$('#stars'); if(sb) sb.innerHTML=starsHTML(run.i);
  const fb=$('#fb'); const last = run.i===run.items.length-1; const nextLbl = last?'See my score':'Next';
  if(res==='exact'){
    if(save.carry[it.ckey]!=null){ save.carry[it.ckey]--; if(save.carry[it.ckey]<=0) delete save.carry[it.ckey]; }
    fb.innerHTML=`<div class="fb good"><b>Correct!</b>${it.kind==='type'&&it.form?` <span class="tiny">With macrons: ${esc(it.model)}</span>`:''}</div><p><button class="primary" id="next">${nextLbl}</button></p>`;
    $('#next').onclick=next; setTimeout(()=>{const n=$('#next'); if(n) n.focus()},250);
  } else if(it.kind==='type'){
    // near miss or wrong on a typed item: show the answer, then type it once to lock it in
    if(res==='close'){ run.close.push(it); save.carry[it.ckey]=Math.max(save.carry[it.ckey]||0,1) } else { run.missed.push(it); save.carry[it.ckey]=2 }
    const msg = res==='close'
      ? `<div class="fb close"><b>So close!</b> Check the spelling: <b>${esc(correctText(it))}</b><div class="why">${pts===1?'You get the point at this level.':pts===.5?'Half a point at this level. Exact spelling earns the full point.':'At this level it has to be spelled exactly. No point this time, but now you know the spelling.'}</div></div>`
      : `<div class="fb bad"><b>Not quite.</b> Answer: <b>${esc(correctText(it))}</b><div class="why">${esc(it.why||'')}</div><div class="pat">Pattern: ${esc(it.pattern)}</div></div>`;
    fb.innerHTML = msg + `<div class="card retry"><div class="rlabel">Type it correctly once to lock it in (this does not count):</div><div id="rans"></div><div id="rfb"></div></div><p><button class="primary" id="next" disabled>${nextLbl}</button></p>`;
    $('#next').onclick=next;
    const rbox=$('#rans');
    const inp = typedInput(rbox,(inp,bx)=>{ const r2=judgeText(inp.value,[it.model,...(it.kind==='type'&&it.form===false?[]:[])],{}); const r3 = (r2==='exact') ? 'exact' : judgeText(inp.value,it.answers.slice(0,1),{});
      if(r2==='exact'||r3==='exact'){ bx.dataset.done=1; inp.disabled=true; inp.classList.add('right'); $('#rfb').innerHTML=`<div class="fb good"><b>Yes!</b> That is how it is spelled.</div>`; const n=$('#next'); n.disabled=false; setTimeout(()=>n.focus(),250) }
      else { inp.classList.remove('right'); $('#rfb').innerHTML=`<div class="fb close">Not quite. Look at it once more: <b>${esc(correctText(it))}</b></div>`; inp.select&&inp.select() } }, 'Check spelling');
  } else {
    save.carry[it.ckey]=2; run.missed.push(it);
    const rt = retryFor(it, run.used);
    fb.innerHTML=`<div class="fb bad"><b>Not quite.</b> Answer: <b>${esc(correctText(it))}</b>
      <div class="why">${esc(it.why||'')}</div><div class="pat">Pattern: ${esc(it.pattern)}</div></div>
      ${rt?`<div class="card retry"><div class="rlabel">Try it again (this one does not count):</div><div class="qtext">${rt.q}</div><div id="rans"></div><div id="rfb"></div></div>`:''}
      <p><button class="primary" id="next" ${rt?'disabled':''}>${nextLbl}</button></p>`;
    $('#next').onclick=next;
    if(rt){ run.used.add(rt.id); renderAnswer(rt, $('#rans'), (r2)=>{ $('#rfb').innerHTML = r2==='exact'?`<div class="fb good"><b>Yes!</b> That is the pattern.</div>`:`<div class="fb bad">Answer: <b>${esc(correctText(rt))}</b><div class="why">${esc(rt.why||'')}</div></div>`; const n=$('#next'); n.disabled=false; setTimeout(()=>n.focus(),250); }); }
  }
  persist();
}
function next(){ run.i++; if(run.i>=run.items.length) finish(); else question() }
function finish(){
  const n=run.items.length, score=run.score, pass=score>=C.passScore;
  const earned=starsFor(score,n,C.passScore), prev=starsFor(save.best[run.lvl]||0,n,C.passScore);
  save.best[run.lvl]=Math.max(save.best[run.lvl]||0,score);
  if(pass && run.lvl>=save.unlocked && run.lvl<LEVELS.length) save.unlocked=run.lvl+1;
  save.history.push({lvl:run.lvl,score,date:new Date().toISOString().slice(0,10)});
  Object.keys(run.sec).forEach(k=>addSkill(k,run.sec[k].r,run.sec[k].n));
  save.recent[run.lvl]=(save.recent[run.lvl]||[]).concat([run.items.map(x=>x.id)]).slice(-2);
  persist();
  const secs = Object.keys(run.sec).map(k=>`<li>${SECNAME[k]||k}: <b>${fmt(run.sec[k].r)}</b> of ${run.sec[k].n}</li>`).join('');
  const pct=Math.round(score/n*100);
  const last = run.lvl===LEVELS.length;
  const msg = pass ? (last?`Last level cleared! ${fmt(score)} of ${n}. Keep practicing to earn 3 stars on every level.`:`Level ${run.lvl} cleared! Level ${run.lvl+1} is open.`) : `${fmt(score)} of ${n}. You need ${C.passScore} to move on. Next try is a fresh mix with your missed words mixed in.`;
  const more = (pass && earned<3) ? ` ${3-earned===1?'One more star':'More stars'} are waiting: ${earned===1?`${n-1} or ${n} right earns more`:`all ${n} right earns the third`}.` : '';
  const missed = run.missed.length? `<h3>To remember</h3><ul>${run.missed.map(m=>`<li>${esc(m.label)}: <b>${esc(correctText(m))}</b></li>`).join('')}</ul>`:'<p>No misses. Wow.</p>';
  const close = run.close.length? `<h3>Spelling to fix</h3><ul>${run.close.map(m=>`<li><b>${esc(correctText(m))}</b></li>`).join('')}</ul>`:'';
  const big = [0,1,2].map(k=>`<span class="${k<earned?'on':'no'}" id="bs${k}">&#9733;</span>`).join('');
  app.innerHTML=`<header><h1>${pass?'Nice work!':'Good try!'}</h1></header><div class="card score ${pass?'pass':''}"><div class="bigstars" role="img" aria-label="${earned} of 3 stars">${big}</div><div class="big">${fmt(score)} / ${n} <span class="pct">(${pct}%)</span></div><p>${esc(msg+more)}</p>
    <ul class="secs">${secs}</ul></div>
    ${BONUS[S.id]?`<button class="guidebtn card" id="bon">&#11088; Bonus: one short sentence. Label the subject, verb, and object, then translate.</button>`:''}
    <div class="card">${missed}${close}</div>
    <p>${pass&&!last?`<button class="primary" id="nl">Go to Level ${run.lvl+1}</button> `:''}<button class="${pass?'':'primary'}" id="again">${pass?'Practice this level again':'Try a fresh mix'}</button> <button id="hm">Levels</button></p>`;
  const nl=$('#nl'); if(nl) nl.onclick=()=>teach(run.lvl+1);
  const bon=$('#bon'), blv=run.lvl; if(bon) bon.onclick=()=>bonusStart(blv);
  $('#again').onclick=()=>teach(run.lvl); $('#hm').onclick=home; window.scrollTo(0,0);
  // celebrate
  if(pass){ Snd.win() } else { Snd.soft() }
  for(let k=0;k<earned;k++){ setTimeout(()=>{ const el=document.getElementById('bs'+k); if(el){ el.classList.add('pop'); } Snd.star(k) }, 500+k*420); }
}

function bonusPick(k){

// The translation check looks for each part (subject, verb, object) on its own, so word order and small extras

const btoks = x => norm(x).split(' ').filter(Boolean);

function bfind(T,phrase,fuzzy){ const P=btoks(phrase); if(!P.length) return -1;

  for(let i=0;i<T.length;i++){ if(!same(T[i],P[0])) continue; let t=i+1, gap=0, ok=true;
    for(let j=1;j<P.length;j++){ if(t<T.length && same(T[t],P[j])){ t++; continue } if(!gap && t+1<T.length && same(T[t+1],P[j])){ gap=1; t+=2; continue } ok=false; break }
    if(ok) return i } return -1 }
function bpart(T,ok,slip){ const f=(l,z)=>{ for(const p of l||[]){ const i=bfind(T,p,z); if(i>=0) return i } return -1 };

  const pS=bpart(T,s.S,s.Sx), pV=bpart(T,s.V,s.Vx), pO=s.O?bpart(T,s.O,s.Ox):null;
  const good=p=>p.st==='ok'||p.st==='spell';
  let tS=null, tV=null, tO=null;
  if(!good(pS)){
    if(!sw) tS = pS.st==='slip' ? `${vw} ends in ${pl?'-nt, so the doer is "they"':'-t, so the doer is one person: he, she, or it'}.` : `There is no subject word, so start with ${pl?'"they"':'he, she, or it'}. The ${pl?'-nt':'-t'} ending on ${vw} tells you.`;
    else tS = pS.st==='slip' ? `${sw} means ${pl?'more than one':'just one'}. Try "${s.S[0]}".` : `Who is doing it? ${sw} means "${s.S[0]}".`;
  } else if(sw && pO && good(pO) && pS.i>pO.i){

let tps=null, tpr=null;
function tpLoad(){ tps={s:{},log:[],fast:false,best:{}}; try{ const x=localStorage.getItem(TPKEY); if(x) tps=Object.assign(tps,JSON.parse(x)) }catch(e){} }

// ---------- checking a typed meaning
const TFILL=new Set(['he','she','it','they','you','we','i','to','did','do','does','been','being','am','will']);
function tstem(w){ while(w.length>3){ const n=w.replace(/(ing|ed|es|s|d|e)$/,''); if(n===w||n.length<3) break; w=n } return w }
function ttoks(x){ const t=norm(x).split(' ').filter(Boolean); const f=t.filter(z=>!TFILL.has(z)); return f.length?f:t }
function tpJudge(input,e){
  const T=ttoks(input).map(tstem); if(!T.length) return 'wrong'; let best='wrong';
  for(const a of e.ok){ const A=ttoks(a).map(tstem); if(!A.length) continue;
    for(let i=0;i+A.length<=T.length;i++){ if(A.every((x,j)=>T[i+j]===x)) return 'exact' }
    if(A.length===1&&T.length===1&&A[0].length>=4&&osa(T[0],A[0])<=1) best='close';
  }
  return best;
}
// strict check for a verb as it appears: tense and number must match, so no stem matching
const TPRON=new Set(['he','she','it','they','we','you','i','also']);
function tpJudgeVerb(input,list){
  const T=norm(input).split(' ').filter(z=>z&&!TPRON.has(z)); if(!T.length) return 'wrong'; let best='wrong';
  for(const a of list){ const A=norm(a).split(' ').filter(z=>z&&!TPRON.has(z)); if(!A.length) continue;
    for(let i=0;i+A.length<=T.length;i++){ if(A.every((x,j)=>T[i+j]===x)) return 'exact' }
    if(A.length===1&&T.length===1&&A[0].length>=5&&osa(T[0],A[0])<=1&&T[0].slice(-2)===A[0].slice(-2)&&!(T[0].length===A[0].length&&[...T[0]].some((c,i)=>c!==A[0][i]&&/[aeiou]/.test(c)&&/[aeiou]/.test(A[0][i])))) best='close';
  }
  return best;
}
function tpDistract(e){
  const used=new Set(e.ok.flatMap(a=>ttoks(a).map(tstem))); const seen=new Set([e.show]);
  const all=Object.values(TPW).filter((x,i,arr)=>x.kind!=='nm'&&arr.indexOf(x)===i);
  const pool=shuffle(all.filter(x=>x.kind===e.kind)).concat(shuffle(all.filter(x=>x.kind!==e.kind)));
  const out=[];
  for(const x of pool){ if(out.length>=3) break; if(seen.has(x.show)) continue; if(ttoks(x.show).map(tstem).some(t=>used.has(t))) continue; seen.add(x.show); out.push(x.show) }
  return out;
}

// ---------- tense sorting warm-up
function tpSortIntro(){
  tpPaint(`${tpHeader('Session '+tpr.sid+' &middot; Warm-up')}<div class="card teach"><h3>First, sort the verbs by tense</h3>
    <p>Mrs. Kimble's test has a sorting part, so we start there. Look at the middle and end of the verb.</p>
    <div class="tense imp"><b class="name">Imperfect</b>: has <b>-ba-</b> in the middle (-bā-, -ēbā-). "was ___ing" or "were ___ing." It was going on.</div>
    <div class="tense perf"><b class="name">Perfect</b>: has <b>-vi-</b> or <b>-vēru-</b> (laudāvit, laudāvērunt), or changes inside (fēcit, dūxit, mīsit). "___ed." It finished.</div>
    <div class="tense"><b class="name">Present</b>: no tense marker, just a person ending (-ō, -s, -t, -nt). "___s" or "is ___ing."</div>
    <p class="tiny">Your Stage 6 class guide called the perfect tense "past-perfect." Mrs. Kimble's test calls it "perfect." It is the same tense.</p>
    <p><button class="primary" id="go">Start sorting (${tpr.d.sort.length} verbs)</button></p></div>`);
  $('#go').onclick=()=>{ tpr.st.phase='sort'; tpr.st.si=0; tpr.st.sp=0; tpr.st.sm=0; tpr.st.sortMiss=[]; tpSave(); tpSortQ() };
}
const TNAME={pres:'Present',imp:'Imperfect',perf:'Perfect'};
function tpSortQ(fb){
  const st=tpr.st, list=tpr.d.sort, n=list.length;

      ${['pres','imp','perf'].map(t=>`<button type="button" class="opt ${res?(t===it[1]?'right':(t===res.pick?'wrong':'')):''}" data-t="${t}" ${res?'disabled':''}>${TNAME[t]}</button>`).join('')}
      ${res?`<div class="fb ${res.ok?'good':'bad'}"><b>${res.ok?'Yes!':'Not quite.'}</b><div class="why">${esc(it[2])}</div></div><p><button class="primary" id="nx">${st.si+1>=n?'See my sorting score':'Next verb'}</button></p>`:''}</div>`);

    ${miss.length?'<ul class="secs">'+miss.map(m=>`<li><span class="lat">${esc(m[0])}</span>: ${TNAME[m[1]]}. ${esc(m[2])}</li>`).join('')+'</ul>':''}

// ---------- one clause at a time
function tpUnitStart(){
  const st=tpr.st, u=tpr.d.units[st.ui]; if(!u) return tpCompare();
  tpr.u=u; tpr.st.rk=tpr.st.rk||{}; const q=[{t:'tap',r:'V'},{t:'mean',root:1},{t:'who'},{t:'tense'},{t:'vfull'},{t:'tap',r:'S'}];
  if(u.s>=0) q.push({t:'num',r:'S'},{t:'mean',i:u.s});
  q.push({t:'tap',r:'O'}); if(u.o>=0) q.push({t:'num',r:'O'},{t:'mean',i:u.o});
  const others=u.w.map((x,i)=>i).filter(i=>i!==u.v&&i!==u.s&&i!==u.o);
  if(tps.fast) q.push({t:'gloss',idx:others}); else others.forEach(i=>q.push({t:'mean',i}));
  q.push({t:'type'},{t:'wi'},{t:'wit'});
  tpr.cur={q,qi:0,tags:{},shown:{}}; tpStep();
}
function tpStep(){
  const c=tpr.cur, s=c.q[c.qi++]; if(!s) return tpUnitDone();
  ({tap:tpTap,mean:tpMean,num:tpNum,who:tpWho,vfull:tpVFull,tense:tpTense,gloss:tpGlossStep,type:tpType,wi:tpWI,wit:tpWIType})[s.t](s);
}
function tpUnitDone(){
  const st=tpr.st; st.ui++; tpSave();
  if(st.ui>=tpr.d.units.length){ st.phase='compare'; tpSave(); tpCompare() } else tpUnitStart();
}
function tpNextBtn(label,fn){ const n=$('#nx'); n.onclick=fn; setTimeout(()=>n.focus(),250) }

// tap the verb / subject / object
function tpTap(s){
  const u=tpr.u,c=tpr.cur,role=s.r; let done=false, fb='';
  const ri=role==='V'?u.v:role==='S'?u.s:u.o;
  const prompt=role==='V'?'<b>Tap the VERB</b>, the action word. It is the action word.'
    :role==='S'?'<b>Tap the SUBJECT</b>, the one doing the action. If there is no subject word, say so.'
    :'<b>Tap the DIRECT OBJECT</b>, the one the action happens to. If there is none, say so.';
  const none=role==='S'?'No subject word (the verb ending tells who)':role==='O'?'No direct object':null;
  const vw=u.w[u.v], vpl=u.vn==='p';
  const why=ok=>role==='V'?`${vw} is the verb, the action word.`
    :role==='S'?(u.s>=0?`${u.w[u.s]} is the subject, the doer.`:(u.imp||'There is no subject word. The verb ending tells who.'))
    :(u.o>=0?`${u.w[u.o]} is the direct object, the one the action happens to.`:(u.no||'Nothing receives the action, so there is no direct object.'));
  const draw=()=>{
    tpUnitPage(`<div class="card q"><div class="qtext">${prompt}</div>${none&&!done?`<button type="button" class="opt" id="tpnone">${none}</button>`:''}${fb}${done?`<p><button class="primary" id="nx">Next</button></p>`:''}</div>`,!done);
    if(!done){ app.querySelectorAll('.btile:not([disabled])').forEach(b=>b.onclick=()=>pick(+b.dataset.k)); if($('#tpnone')) $('#tpnone').onclick=()=>pick(-1) }
    else tpNextBtn('Next',tpStep);
  };
  const pick=k=>{ if(done) return; done=true; const ok=k===ri; tpTally('l',ok?1:0); if(ok) Snd.ok(1); else Snd.bad(); if(ri>=0) c.tags[ri]=role;
    fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Yes!':'Not quite.'}</b><div class="why">${esc(why(ok))}</div></div>`; tpSave(); draw() };
  draw();
}

// meaning: type a guess, then pick from four (half point), then see it and type it in
function tpMean(s){
  const u=tpr.u,c=tpr.cur; let w,e,R=null;
  if(s.root){ R=TPROOT[wk(u.w[u.v])]; const b=TPW[wk(u.w[u.v])]; if(!R||!b||tpr.st.rk[R.inf]) return tpStep(); w=R.inf; e={id:'r:'+R.inf,kind:'v',show:R.show,ok:b.ok} }
  else { w=u.w[s.i]; e=TPW[wk(w)]; if(!e||tpKnown(w)){ c.shown[s.i]=true; return tpStep() } }
  let stage=0,tries=0,pts=0,opts=null,msg='';
  const note=R?' This is the "to ___" form: the verb with no who or when yet.':'';
  const sh=R?'to '+e.show:e.show;
  const learn=(p)=>{ pts=p; if(R) tpr.st.rk[R.inf]=1; else { tpr.st.known[e.id]=e.show; c.shown[s.i]=true } tpr.st.mp+=p; tpr.st.mm+=1;
    if(p<1){ tps.log.unshift({d:new Date().toISOString().slice(0,10),sid:tpr.sid,w:w,show:sh,pts:p}); tps.log=tps.log.slice(0,80) } tpSave(); };

    else if(stage===0) body=`<div class="qtext">What does <span class="lat">${esc(w)}</span> mean?<div class="hint">Type your best guess.${note}</div></div><div id="bx"></div>`;
    else if(stage===1) body=`<div class="qtext">Not quite. Pick the best meaning for <span class="lat">${esc(w)}</span>. <span class="hint">(half a point)</span></div>${opts.map((o,i)=>`<button type="button" class="opt" data-i="${i}">${esc(o)}</button>`).join('')}`;
    else body=`<div class="fb bad"><b><span class="lat">${esc(w)}</span> means: ${esc(sh)}.</b></div><div class="qtext">Type it in so it sticks.</div><div id="bx"></div>${msg}`;
    tpUnitPage(`<div class="card q">${body}</div>`,false);
    if(stage===0||stage===2){ const inp=typedInput($('#bx'),(inp,bx)=>{ bx.dataset.done=1; inp.disabled=true; const r=tpJudge(inp.value,e);
        if(stage===0){ if(r!=='wrong'){ Snd.ok(2); learn(1); stage=3 } else { Snd.close(); opts=shuffle([e.show].concat(tpDistract(e))); stage=1 } }

        draw() },'Check'); setTimeout(()=>{try{inp.focus()}catch(x){}},50); }
    else if(stage===1) app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ if(opts[+b.dataset.i]===e.show){ Snd.ok(1); learn(.5); stage=3 } else { Snd.bad(); stage=2 } draw() });

}
function tpNum(s){

  const q=r==='V'?`The verb <span class="lat">${esc(w)}</span>: is one person doing it, or more than one?`:r==='S'?`The subject <span class="lat">${esc(w)}</span>: is it one, or more than one?`:`The direct object <span class="lat">${esc(w)}</span>: is it one, or more than one?`;
  const why=r==='V'?(u.vn==='p'?`${w} ends in ${/runt$/.test(strip(w))?'-ērunt':'-nt'}, so it is "they": more than one.`:`${w} ends in -t, so it is one doer: he, she, or it.`)
    :r==='S'?(u.sw||`${w} is one person.`):(u.ow||`${w} is one.`);

    tpUnitPage(`<div class="card q"><div class="qtext">${q}</div>${['s','p'].map(t=>`<button type="button" class="opt ${done?(t===ans?'right':(t===done?'wrong':'')):''}" data-n="${t}" ${done?'disabled':''}>${t==='s'?'One (singular)':'More than one (plural)'}</button>`).join('')}${fb}${done?'<p><button class="primary" id="nx">Next</button></p>':''}</div>`,false);
    if(!done) app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ const ok=b.dataset.n===ans; done=b.dataset.n; tpTally('l',ok?1:0); if(ok) Snd.ok(1); else Snd.bad(); fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Yes!':'Not quite.'}</b><div class="why">${esc(why)}</div></div>`; draw() });
    else tpNextBtn('Next',tpStep);
  };
  draw();
}

// who is doing it (he, she, it, they ...): the ending, asked about, never given away
function tpWho(){
  const u=tpr.u,w=u.w[u.v],ans=u.vn==='p'?'they':'he'; let done=false,fb='';
  const opts=[['he','he, she, or it (one)'],['they','they (more than one)'],['i','I (one) or we (more than one)'],['you','you (one or more)']];
  const why=u.vn==='p'?`${w} ends in ${/runt$/.test(strip(w))?'-ērunt':'-nt'}, so it is "they": more than one.`:`${w} ends in -t, so it is one doer: he, she, or it.`;
  const draw=()=>{
    tpUnitPage(`<div class="card q"><div class="qtext">Now the verb as it appears in the sentence: <span class="lat">${esc(w)}</span>. Who is doing the action?</div>${opts.map(o=>`<button type="button" class="opt ${done?(o[0]===ans?'right':(o[0]===done?'wrong':'')):''}" data-n="${o[0]}" ${done?'disabled':''}>${o[1]}</button>`).join('')}${fb}${done?'<p><button class="primary" id="nx">Next</button></p>':''}</div>`,false);
    if(!done) app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ const ok=b.dataset.n===ans; done=b.dataset.n; tpTally('l',ok?1:0); if(ok) Snd.ok(1); else Snd.bad(); fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Yes!':'Not quite.'}</b><div class="why">${esc(why)}</div></div>`; draw() });
    else tpNextBtn('Next',tpStep);
  };
  draw();
}
// put root + who + when together: the verb as it appears, translated
function tpVFull(){
  const u=tpr.u,c=tpr.cur,w=u.w[u.v],e={ok:u.V,show:u.V[0]},x={ok:u.Vx||[]}; let tries=0,done=0,msg='';
  const tl={pres:'present',imp:'imperfect',perf:'perfect'}[u.tn];
  const draw=()=>{
    const body=done?`<div class="fb ${done===1?'good':'close'}"><b>${done===1?'Yes!':'Now you have it.'} <span class="lat">${esc(w)}</span> here means "${esc(u.V[0])}".</b></div><p><button class="primary" id="nx">Next</button></p>`
      :`<div class="qtext">Put it together. What does <span class="lat">${esc(w)}</span> mean as it appears here?<div class="hint">Use the root meaning, who is doing it, and when (${tl}).</div></div><div id="bx"></div>${msg}`;
    tpUnitPage(`<div class="card q">${body}</div>`,false);
    if(!done){ const inp=typedInput($('#bx'),(inp,bx)=>{ bx.dataset.done=1; inp.disabled=true; const r=tpJudgeVerb(inp.value,u.V); tries++;
        if(r!=='wrong'){ Snd.ok(2); tpTally('l',tries===1?1:0); done=1 }
        else if(tries>=2){ Snd.bad(); tpTally('l',0); done=2 }
        else { Snd.close(); msg=tpJudgeVerb(inp.value,u.Vx||[])!=='wrong'?`<div class="fb close">Right verb, but check who is doing it and when (${tl}). Try once more.</div>`:`<div class="fb close">Not quite. Look at the root meaning, who, and when. Try once more.</div>` }
        if(done){ c.vfull=u.V[0]; c.shown[u.v]=true; tpSave() } draw() },'Check'); setTimeout(()=>{try{inp.focus()}catch(z){}},50); }
    else tpNextBtn('Next',tpStep);
  };
  draw();
}
function tpTense(){
  const u=tpr.u,w=u.w[u.v],sw=strip(w); let done=false,fb='';
  const why=u.tn==='imp'?(/^(erat|aderat)$/.test(sw)?`${w} is a form of "to be" meaning "was." It is the imperfect, so it was going on.`:`${w} has -ba- (or -bā-, -ēbā-) in the middle. That marks the imperfect: was or were ___ing, an action that was going on.`)
    :u.tn==='perf'?(/vit$|verunt$/.test(sw)?`${w} has -vi- (-vit or -vērunt): a finished action, "___ed." This is the perfect.`:`${w} is an irregular perfect: the verb changes inside (like English send and sent). It is a finished action.`)
    :`${w} has no tense marker, just a person ending, so it is happening now: the present.`;
  const labels={pres:'Present (happening now)',imp:'Imperfect (was or were ___ing, going on)',perf:'Perfect (___ed, finished)'};
  const draw=()=>{
    tpUnitPage(`<div class="card q"><div class="qtext">When is it happening? What tense is <span class="lat">${esc(w)}</span>?</div>${['pres','imp','perf'].map(t=>`<button type="button" class="opt ${done?(t===u.tn?'right':(t===done?'wrong':'')):''}" data-t="${t}" ${done?'disabled':''}>${labels[t]}</button>`).join('')}${fb}${done?'<p><button class="primary" id="nx">Next</button></p>':''}</div>`,false);
    if(!done) app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const ok=b.dataset.t===u.tn; done=b.dataset.t; tpTally('l',ok?1:0); if(ok) Snd.ok(1); else Snd.bad(); fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Yes!':'Not quite.'}</b><div class="why">${esc(why)}</div></div>`; draw() });
    else tpNextBtn('Next',tpStep);
  };
  draw();
}
// faster mode: show the remaining words with meanings
function tpGlossStep(s){
  const u=tpr.u; const rows=s.idx.filter(i=>!tpKnown(u.w[i]));
  rows.forEach(i=>{ const e=TPW[wk(u.w[i])]; if(e) tpr.st.known[e.id]=e.show });
  s.idx.forEach(i=>tpr.cur.shown[i]=true);
  if(!rows.length) return tpStep();
  tpUnitPage(`<div class="card q"><div class="qtext">The other words in this sentence:</div><ul class="secs">${rows.map(i=>`<li><span class="lat">${esc(u.w[i])}</span> = ${esc(TPW[wk(u.w[i])].show)}</li>`).join('')}</ul><p><button class="primary" id="nx">Got it</button></p></div>`,false);
  tpNextBtn('Got it',tpStep);
}

// review a typed translation by parts (subject, verb, object)
function tpReview(text,src,ctx){
  const T=btoks(text), good=p=>p.st==='ok'||p.st==='spell'; const rows=[]; let got=0,of=0,spell=0;
  const add=(name,p,tip)=>{ of++; const ok=good(p); if(ok){ got++; if(p.st==='spell') spell++ } rows.push(`<div class="rv ${ok?'ok':'tip'}"><span class="ic">${ok?'&#10003;':'!'}</span><span><b>${name}:</b> ${ok?'found it.':esc(tip)}</span></div>`) };
  if(src.S&&src.S.length){ const p=bpart(T,src.S,src.Sx); add('Subject',p,p.st==='slip'?`Check how many are doing it. Try "${src.S[0]}".`:`Who is doing it? ${ctx.sw?ctx.sw+' means ':'Try '}"${src.S[0]}".`) }
  const pv=bpart(T,src.V,src.Vx);
  const vt={pres:`${ctx.vw} has no tense marker, so it is happening now. Try a present form like "${src.V[0]}".`,imp:(/^(erat|aderat)$/.test(strip(ctx.vw))?`${ctx.vw} is the imperfect of "to be", so it was going on: use was or were, like "${src.V[0]}".`:`${ctx.vw} has -ba-, so it was going on: use was or were ___ing, like "${src.V[0]}".`),perf:`${ctx.vw} is a finished action, so use the past, like "${src.V[0]}".`}[ctx.tn];
  add('Verb',pv,pv.st==='slip'?vt:`I could not find the verb. ${ctx.vw} means "${src.V[0]}".`);
  if(src.O&&src.O.length){ const p=bpart(T,src.O,src.Ox); add('Object',p,p.st==='slip'?`Check how many. Try "${src.O[0]}".`:`What does it happen to? ${ctx.ow?ctx.ow+' means ':'Try '}"${src.O[0]}".`) }

}
function tpType(){
  const u=tpr.u; let done=false;

  const inp=typedInput($('#bx'),(inp,bx)=>{ bx.dataset.done=1; inp.disabled=true;
    const r=tpReview(inp.value,u,{sw:u.s>=0?u.w[u.s]:null,vw:u.w[u.v],ow:u.o>=0?u.w[u.o]:null,tn:u.tn});
    tpTally('t',r.got,r.of); tpr.st.trans[tpr.st.ui]={l:u.w.join(' '),a:inp.value,m:u.en}; if(r.got===r.of) Snd.ok(3); else Snd.close(); tpSave();
    $('#rv').innerHTML=`<div class="card"><h3>${r.got===r.of?'Great translation!':'Check-up'}</h3>${r.rows}${r.spell?'<p class="tiny">Close spelling counts here.</p>':''}${tpCmp(inp.value,u.en)}<p class="tiny">The checker looks for the subject, verb, and object. It can miss a good answer said a different way. If you think yours is right, show Mom or Dad.</p><p><button class="primary" id="nx">Next: what if one thing changed?</button></p></div>`;
    tpNextBtn('Next',tpStep); window.scrollTo(0,document.body.scrollHeight) },'Check my translation');
  setTimeout(()=>{try{inp.focus()}catch(x){}},50);
}
const WIOPT={tense:'When it happens (the tense)',num:'How many are doing it (one or more than one)',obj:'What the action happens to (the object)',subj:'Who is doing it (a different subject)'};
const tpCh=x=>x.replace(/[.,;:!?"“”]/g,'');
function tpDiff(a,b){ const A=a.split(' '),B=b.split(' ');
  const ha=A.map((x,i)=>B.length===A.length?(tpCh(x)!==tpCh(B[i])):!B.map(tpCh).includes(tpCh(x)));
  const hb=B.map((x,i)=>A.length===B.length?(tpCh(x)!==tpCh(A[i])):!A.map(tpCh).includes(tpCh(x)));
  const f=(T,h)=>T.map((x,i)=>h[i]?`<mark class="chg">${esc(x)}</mark>`:esc(x)).join(' ');
  return [f(A,ha),f(B,hb)]; }
function tpWI(){
  const u=tpr.u,wi=u.wi; let done=false,fb='';
  const order=shuffle(['tense','num','obj','subj']);
  const draw=()=>{
    tpUnitPage(`<div class="card q"><div class="qtext">Now one thing changed. Here is the new sentence:</div><div class="latq">${tpDiff(u.w.join(' '),wi.lat)[1]}</div><div class="hint">Before: <span class="lat">${tpDiff(u.w.join(' '),wi.lat)[0]}</span> <span class="chgkey">(the colored word is the one that changed)</span></div>

    else tpNextBtn('Next',tpStep);

}
function tpWIType(){
  const u=tpr.u,wi=u.wi;

  const inp=typedInput($('#bx'),(inp,bx)=>{ bx.dataset.done=1; inp.disabled=true;

    const last=tpr.st.ui+1>=tpr.d.units.length;
    $('#rv').innerHTML=`<div class="card"><h3>${r.got===r.of?'Nice!':'Check-up'}</h3>${r.rows}${tpCmp(inp.value,wi.en)}<div class="why">${esc(wi.why)}</div><p><button class="primary" id="nx">${last?'See the whole story':'Next sentence'}</button></p></div>`;
    tpNextBtn('Next',tpStep); window.scrollTo(0,document.body.scrollHeight) },'Check my translation');

// ---------- the whole story, side by side
function tpCompare(){

}

  tpPaint(`${tpHeader('Session '+tpr.sid+' &middot; Done')}<div class="card score"><div class="bigstars" role="img" aria-label="${stars} of 3 stars">${starRow(stars)}</div><div class="big">${Math.round(r*100)}%</div>
    <ul class="secs"><li>Tense sorting: <b>${st.sp}</b> of ${st.sm}</li><li>Word meanings: <b>${fmt(st.mp)}</b> of ${st.mm}</li><li>Verb, subject, object, number, tense steps: <b>${st.lp}</b> of ${st.lm}</li><li>What changed: <b>${st.qp}</b> of ${st.qm}</li><li>Translation parts found: <b>${st.tp}</b> of ${st.tm}</li></ul>
    <p class="tiny">About ${mins} minute${mins===1?'':'s'}.</p></div>
